name: Convert portfolio images to WebP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  convert-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Convert JPG assets to WebP
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          image_dir = Path("images")
          for source in image_dir.glob("*.jpg"):
              target = source.with_suffix(".webp")
              with Image.open(source) as image:
                  image.save(target, "WEBP", quality=86, method=6)

          html = Path("index.html")
          content = html.read_text(encoding="utf-8")
          content = content.replace(".jpg", ".webp")
          html.write_text(content, encoding="utf-8")

          for source in image_dir.glob("*.jpg"):
              source.unlink()
          PY
      - name: Commit converted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images
          if ! git diff --cached --quiet; then
            git commit -m "Convert portfolio images to WebP"
            git push
          fi
